
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendPulse - AI-Curated Trending Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; background: #f4f4f4; color: #333; }
    header { background: #111; color: white; padding: 1rem; text-align: center; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; padding: 1rem; }
    .product-card { background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .product-card img { width: 100%; border-radius: 8px; }
    .product-card h3 { margin-top: 0.5rem; font-size: 1.1rem; }
    .product-card a { display: inline-block; margin-top: 0.5rem; padding: 0.5rem 1rem; background: #0070f3; color: white; text-decoration: none; border-radius: 6px; }
    footer { text-align: center; padding: 2rem 1rem; font-size: 0.9rem; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>TrendPulse</h1>
    <p>Discover the hottest products trending online, updated daily by AI</p>
  </header>
  <main class="products" id="product-container">
    <!-- Products will load here via JS -->
  </main>
  <footer>
    &copy; 2025 TrendPulse. Powered by AI.
  </footer>

  <script>
    fetch('products.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('product-container');
        data.products.forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img src="${product.image}" alt="${product.title}">
            <h3>${product.title}</h3>
            <p>${product.description}</p>
            <a href="${product.link}" target="_blank">Buy Now</a>
          `;
          container.appendChild(card);
        });
      });
  </script>
</body>
</html>
